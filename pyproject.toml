[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unfoldfs"
version = "0.1.0"
description = "UnfoldFS: unfolding supercell VASP band structures and rendering Fermi surfaces in the primitive BZ"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = []
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",
    "spglib>=2.0",
]

# 画图是**可选**的: 只有 `unfoldfs band` 的 PNG 需要 matplotlib;
# gen / unfold / info 与 band 的四个 vaspkit 文本文件都不需要它。
[project.optional-dependencies]
plot = ["matplotlib>=3.5"]

[project.scripts]
unfoldfs = "unfoldfs.cli:main"

[tool.setuptools]
packages = ["unfoldfs"]
