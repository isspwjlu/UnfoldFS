[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unfoldfs"
version = "0.1.0"
description = "超胞 VASP 计算的反折叠与费米面生成"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = []
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",
    "spglib>=1.15",
]

[project.scripts]
unfoldfs = "unfoldfs.cli:main"

[tool.setuptools]
packages = ["unfoldfs"]
